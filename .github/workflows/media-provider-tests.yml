name: Media provider tests

on:
  pull_request:
    paths:
      - ".env.example"
      - "skills/media-use/**"
      - ".github/workflows/media-provider-tests.yml"
  push:
    branches:
      - "feat/stock-audio-providers"
    paths:
      - ".env.example"
      - "skills/media-use/**"
      - ".github/workflows/media-provider-tests.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.files.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Discover media-use tests
        id: files
        shell: bash
        run: |
          set -euo pipefail
          TESTS=$(find skills/media-use -type f -name "*.test.mjs" | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

  media-provider-tests:
    needs: discover
    name: Test ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run test file
        run: node --test "${{ matrix.test }}"
