name: Media provider tests

on:
  pull_request:
    paths:
      - ".env.example"
      - "skills/media-use/**"
      - ".github/workflows/media-provider-tests.yml"
  push:
    branches:
      - "feat/stock-audio-providers"
    paths:
      - ".env.example"
      - "skills/media-use/**"
      - ".github/workflows/media-provider-tests.yml"

permissions:
  contents: read

jobs:
  media-provider-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run skill test files independently
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SKILLS_TESTS < <(find skills -type f -name "*.test.mjs" | sort)
          for test_file in "${SKILLS_TESTS[@]}"; do
            echo "::group::$test_file"
            if ! node --test "$test_file" > /tmp/test-file.log 2>&1; then
              echo "::error file=$test_file::Skill test file failed"
              cat /tmp/test-file.log
              echo "::endgroup::"
              exit 1
            fi
            tail -n 8 /tmp/test-file.log
            echo "::endgroup::"
          done
