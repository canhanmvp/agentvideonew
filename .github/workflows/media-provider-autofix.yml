name: Temporary media provider autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches:
      - "feat/stock-audio-providers"

permissions:
  contents: write

jobs:
  format-and-manifest:
    if: >-
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, 'chore(media): apply formatter and refresh skills manifest')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "feat/stock-audio-providers"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and refresh skills manifest
        run: |
          bun run format
          bun packages/cli/scripts/gen-skills-manifest.ts

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(media): apply formatter and refresh skills manifest"
          git push origin HEAD:feat/stock-audio-providers
